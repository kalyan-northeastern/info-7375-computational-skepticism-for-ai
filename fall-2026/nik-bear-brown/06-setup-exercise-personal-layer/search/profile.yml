# search/profile.yml for Professor Bear: What You Want and What Constrains You (exercise 06, Step 2).
# Written 2026-10-18 by Claude Code from Professor Bear's own answers in chat; he corrected the first draft
# twice (business schools, then the visa, location and engagement answers). A value is here only where he said it
# or a project file records it, and the source is in the comment. Anything not yet known is null, with the question
# that would fill it. Nothing is claimed that he did not state.
# Schema follows the engine's example personas (search/examples/*/profile.yml).
candidate:
  name: Professor Bear            # public example name used in this folder; no contact details
  location: null                  # Q3: see below
target_role:
  # Q1. Said by Professor Bear, 2026-09-26 and 2026-10-18 (FRICTIONAL.md). Two tracks, not one.
  # Two equal tracks. Business-school AI roles were first left out of this draft as a footnote; Professor Bear
  # corrected that on 2026-10-18: they are a main target, for the reasons in business_school_rationale below.
  primary: >-
    Track A, business schools: bring real AI expertise into a business school to direct an AI research centre or
    an AI educational effort (informally: run the school's AI group). That can be a director, centre-lead or
    executive-education-director role, a professor of practice, a programme that trains the school's own faculty
    in AI, or faculty including a joint appointment between business and engineering (Northeastern's included).
    The point is what a business school offers that other departments do not: executive education, specialised AI
    workshops and training, white-label programmes for executives, and the budget to pay for it.
  secondary:
    - >-
      Track B, AI and design-tool companies: a role that makes educational materials or advocates for educators
      (education, advocate, enablement, curriculum, developer-education roles), where the work is teaching a
      public how to use the product.
    - >-
      Track C, connector roles at AI companies: an enterprise or higher-education account, partnerships,
      education marketing or adoption role that owns a large university relationship. He said his experience
      would be a unique advantage there.
    - >-
      Track D, part-time postdoc-style research, found by writing to labs directly (see outreach_search below):
      biology or computational biology (epidemiology and endocrinology at Harvard Medical School were his
      examples), or business research on AI (Harvard Business School, MIT Sloan and the labs there). About 20
      hours a week in term, full-time in summer. He has done this before.
  excluded:
    - Sales roles that only say "educate customers" in the ad (28 Enterprise Account Executive roles for banks, retailers and carmakers were correct rejects).
    - Roles about consulting firms or systems integrators (the Senior Partner Account Manager posting was a correct miss).
  target_role_unknowns:
    - A pay number, if any? He cares about pay but said per-day versus per-project does not matter.   # QUESTION
    - Which summer months are free?   # QUESTION (hours are answered: 20 a week in term, full-time in summer)
    - Is a Northeastern joint appointment (business plus engineering) something you would start by approaching, not waiting for a listing?   # QUESTION
visa:
  # Q2. Professor Bear, 2026-10-18: born in Brazil to US parents; holds Brazilian and US citizenship.
  type: no constraint             # US and Brazilian citizen, therefore no sponsorship needed; no authorization end date, no unemployment clock
  authorization_end_date: null
  unemployment_days_used: null    # not applicable (not on OPT)
  stem_eligible: null             # not applicable
  buffer_target: null
  notes: >-
    No visa clock and no sponsorship gate. The engine's sponsorship scorer should be off for this profile.
    Citizenship is personal data. Professor Bear decided on 2026-10-18 that it may be public: he asked for this file to be published and for the film to say "US and Brazilian citizen, therefore I need no sponsorship."
geography:
  # Q3. Professor Bear, 2026-10-18.
  current_location: Boston, MA    # he would work here because it means no move
  open_to_remote: true            # much of the work is expected to be remote, on top of teaching
  willing_to_relocate: >-
    Only to a place with a reasonable cost of living (Providence, near Brown, was his example) or somewhere warmer.
  never:
    - New York City
    - San Francisco
  los_angeles: UCLA only          # no other Los Angeles employer
  summer_work: location does not matter; any place is fine for a summer
  metros: [Boston, Providence]   # Providence is very close to Boston and much cheaper (Professor Bear, 2026-10-18)
preferences:
  # Q4. Professor Bear, 2026-10-18.
  engagement:
    wanted: [consulting, summer work, part-time work, short contracts, part-time postdoc-style research]
    not_wanted: permanent full-time employment
    why: work to be done alongside teaching, not instead of it
  seniority: not a criterion              # "I care about fit and pay"
  optimise_for: [fit, pay]
  how_he_judges_an_offer: >-
    Is it interesting work, does he think it does good, and does it fit the flexibility? Pay matters, but not
    whether it is paid per day or per project; a mix is fine.
  availability:
    during_teaching: 20 hours a week
    summer: full-time
  business_schools_also_weigh: [pay, contract length]
  business_school_roles_wanted: >-
    Beyond faculty: executive education director, AI director, AI centre lead, professor of practice, and
    programmes that train the school's own faculty in AI. His experience is that business schools are
    pretty clueless about AI and need direction, and he thinks these roles may fit better than teaching posts.
  sectors:
    - AI companies (frontier labs and AI tools)
    - Design and developer tools
    - Higher education (universities and business schools)
  hard_exclusion: >-
    The work must be directly applicable to improving education through AI in a transformative way. This is not a judgment that other products are bad or not useful: Stripe and Writer do useful things, but he does not see them as transformative for education.
  employers_most_wanted:                         # Professor Bear, 2026-10-18; "et cetera, et cetera" means the list is open
    - Anthropic
    - OpenAI
    - Microsoft          # not in the watch list yet: its collector exists but has not run here
    - Google             # same: custom collector, not run here
    - Figma
    - Canva
    - GitHub             # maybe; not readable by the three job-board APIs Lectern uses
    - Notion             # to look into
  to_look_into: [Jasper AI (likely to go), GitLab (only "if it is real")]
  removed_from_the_watch_list_2026_10_18: [Stripe, Writer]   # done in lectern/sources.json; recorded there under "removed"
  company_size: null              # not stated; not treated as a constraint
sponsorship:
  # Q5.
  requires_employer_sponsorship: false
business_school_rationale:
  # Professor Bear's reasoning, 2026-10-18. The salary figures in his pasted text (AACSB "2026" averages, rank
  # bands) were NOT checked against the source and are not copied here; do not quote them without checking.
  - Business schools pay more than other departments and have the budget to recruit AI people.
  - They run executive education, specialised AI workshops, AI training and white-label programmes for executives.
  - He has been approached for such work but it is politically hard to get from outside the business school.
  - A joint appointment (business plus engineering) at Northeastern would be one way in.
business_school_watch_list: >-
  The business schools in lectern/faculty_config.json (12 on 2026-10-18, plus Brown): Harvard Business School, MIT Sloan, Duke Fuqua,
  Cornell Johnson, Vanderbilt Owen, UCLA Anderson, UT Austin McCombs, UT Dallas Jindal, Boston College Carroll,
  UC San Diego Rady, UNC Kenan-Flagler, Northeastern D'Amore-McKim, and Brown (added 2026-10-18), then on the same day Virginia Darden, Dartmouth Tuck, Rice Jones, emlyon, IESE, London Business
  School, HEC Paris and ESADE (UNC Kenan-Flagler was already on the list). The feeds are American, so the five European
  schools are unlikely to show listings through them; see the log. Brown has no
  standalone business school; its executive MBA is run by its School of Professional Studies with IE Business School,
  so the entry searches Brown University listings, not a business school by name. Listings are read through the
  Chronicle and Inside Higher Ed feeds; most schools' own job systems cannot be read by a script.
outreach_search:
  # Professor Bear, 2026-10-19. A different kind of search: not postings, but labs that may never advertise.
  what: >-
    Part-time postdoc-style research work, found by reading the websites of labs in Boston and writing to the
    lab directly, either to the principal investigator or to the lab manager, with a short proposal.
  precedent: He has done this before.
  what_he_offers: A teaching professor with about 20 hours a week to work part-time in term, and full-time over the summer.
  where:
    - Boston labs and departments, including epidemiology and endocrinology at Harvard Medical School
    - Harvard Business School and MIT Sloan (business research on AI), and the MIT Media Lab (named by him as right next to the Broad)
    - Research institutes and think tanks that do business or AI research, and the Broad Institute and the Whitehead Institute
    - The big Boston hospitals' research labs: Massachusetts General Hospital and Boston Children's Hospital (named by him), and others ("et cetera"; the rest of the list is still to be named)
  unit: the lab (he is applying to a lab, not to a principal investigator in particular)
  fields: [biology, computational biology, business (AI research at Harvard Business School, MIT Sloan and the labs there)]
  method: >-
    Read each lab's public website and keep one JSON record per lab. Then email the person who would decide:
    "this is my background; do you want to talk?" The emails are written and sent by Professor Bear, never by an agent.
  record_per_lab:
    - what the lab does
    - whether it is a match for what he does
    - the principal investigator
    - who should get the email
    - whether there is a lab manager, and their name
    - the page it came from and the date it was read
  privacy: >-
    The lab records name people and may hold work email addresses. They stay on his machine, not in this public
    repository. Only counts and method are published.
  how_far: >-
    The work is expected to be mostly remote, with on-site visits at most about once a week. So the labs are within
    about one to three miles of Northeastern, reachable by a few T stops. He would not go as far as Tufts.
  in_range:
    - Longwood: Harvard Medical School, the Harvard Chan School of Public Health, the pharmacy school (MCPHS) and the hospitals around them, including Boston Children's, about three T stops away
    - Massachusetts General Hospital: the farthest he wants to go; fine once a week
    - Harvard and Cambridge, particularly where the Broad Institute is, which also has a number of think tanks
    - Allston
  out_of_range: [Tufts]
  companies_to_look_at:
    - >-
      Moderna, in Kendall Square near the Broad (seen on his map, 2026-10-19). Named as a great target. What the public record
      shows is a company that already uses AI heavily and has its own data science and AI research team, so a need for
      outside help has not been shown. He wants to pitch it anyway: a collaboration, not necessarily a job, and if they
      do not want part-time or summer work that is fine. The unit is a team inside the company (Research and Early
      Development, the Data Science and AI Research team, the Therapeutic Area Bioinformatics team, all named in public
      job listings), treated like a lab; see lab-outreach/PLACES.md.
  think_tank_meaning: >-
    Professor Bear, 2026-10-19: a think tank, broadly, is a group of very smart people working on hard problems. An
    institute, a center, a lab or a policy shop all count, so the Broad and the Whitehead are think tanks. The kind
    of place is not a filter.
  interest_filter:
    # What a place has to work on to be read. Applied on 2026-10-19 to a research snapshot of Boston and Cambridge
    # institutions he pasted; the result is the "Filtered by interest" table in lab-outreach/PLACES.md.
    topics: [biology, finance, economics, people doing interesting things with education]
    named_place: the MIT Media Lab
    thin_in_the_snapshot: [finance (nothing on markets or corporate finance), education]
  review_gate:
    # Professor Bear, 2026-10-19: nothing is approached without a person looking at the group first.
    rule: >-
      Labs and research groups that look like great fits are posted to the #professor-bear Discord channel (the page,
      not a job). He reads the page and decides. If great fits yield nothing, he will say when to move to pretty good fits.
    tiers: [great, pretty_good]
    posted_by: lectern/notify.py post_labs(); see CLAUDE.md Rule 5
    for_a_company: a research group's page, not a job posting (Moderna)
  northeastern_arrangement:
    # Professor Bear, 2026-10-19, in his words: "I have to look into the actual agreements. But I don't see why
    # Northeastern couldn't hire me as a consultant or some sort of joint faculty."
    hypothesis: Northeastern could engage him as a consultant, or in some joint-faculty arrangement, alongside the outside research.
    unknown: What his agreements and outside-activity terms say, and what strings they attach. He will read them himself. Nothing is assumed here about what they allow.
    status: to look into
  special_search_first:
    # Professor Bear, 2026-10-19: "a special search of the Northeastern Business School. Those are the easiest people to
    # contact. And I have my MBA from the school." Then the Institute for Experiential AI.
    where: [Northeastern D'Amore-McKim School of Business, Northeastern Institute for Experiential AI]
    ask: Would anyone there work with him in a paid way, on research with their group?
    done_2026_10_19: >-
      Pages read by hand; two great fits posted to Discord (the business school's AI hub and the Institute's AI + Life
      Sciences area); seven pretty-good or unrated groups recorded. See lab-outreach/PLACES.md. The records name people
      he said he knows and stay local.
    open: Neither great fit states any pay for an outside or part-time researcher; pay is for the conversation.
  places_list: lab-outreach/PLACES.md   # the institutions in range, grouped by area, with how sure each entry is
  status: Not built. No lab list has been defined and no website has been read.
  best_fit: >-
    Labs doing computational biology, meaning labs that deal with a lot of genomic or other biological data.
  fit_criteria:
    biology: >-
      Computational biology; high-throughput biology and genomics; any lab dealing with a lot of data; a lab that
      could use a database built for its research. In short, a lab that needs a computational biologist.
    business: >-
      A group that wants to do AI research but does not have the technical capacity to do it.
  target_rule:
    - A lab is the unit. A faculty member with no lab website is recorded but is not a target.
    - A lab needs funding to pay for him. One that looks too small, such as a single person, probably has none and is not a target.
    - Fit is a suggestion from the page's own words; Professor Bear gives the verdict.
  hospitals_still_to_name: ["other Longwood-area hospitals and institutes (Brigham and Women's, Beth Israel Deaconess, Dana-Farber, Joslin) are close to Boston Children's and Harvard Medical School; confirm each"]
  first_pilot: not chosen (the Harvard Medical School Division of Nutrition people page was read to design the record)
  to_decide:
    - Which departments and labs to start with (the first pilot).

revisions:
  # A profile is not written once. Each line is a change Professor Bear made after seeing something, with the
  # date and what he saw, taken from FRICTIONAL.md. Add a line whenever a target changes.
  - date: 2026-09-26
    change: target narrowed to roles that make teaching materials for a named audience
    because: a Replit "Learning Experiences Creator" posting had been rejected over one missing word
  - date: 2026-10-18
    change: faculty roles at business schools that are about AI added as a target
    because: the faculty reader's first run found an applied-AI professorship at Chicago Booth and the executive director of an AI institute at Boston College
  - date: 2026-10-18
    change: account and partnership roles that reach universities added as a target
    because: a posting for global systems integrators was a correct miss, and he saw the university version of that role would fit him
  - date: 2026-10-18
    change: business-school target widened from faculty to bringing real AI expertise in to direct an AI research centre or AI educational effort (AI director, centre lead, executive education director, professor of practice, faculty AI training)
    because: his own experience that business schools are weak on AI and need real expertise to direct their research and educational efforts; the listings above show such roles exist. Not yet measured against a feed.
  - date: 2026-10-18
    change: Stripe and Writer removed from the watch list
    because: he does not see them as directly applicable to transformative, AI-driven improvement of education; not a judgment that they are bad or not useful
  - date: 2026-10-18
    change: Brown (School of Professional Studies) added to the business-school watch list; Providence added as an acceptable base
    because: Brown has no business school of its own but offers an executive MBA with IE Business School; Providence is close to Boston and much cheaper
  - date: 2026-10-18
    change: eight more business schools added to the watch list (Virginia Darden, Dartmouth Tuck, Rice Jones, emlyon, IESE, London Business School, HEC Paris, ESADE)
    because: Professor Bear's list of target schools; the European ones may need a different source than the American feeds
  - date: 2026-10-19
    change: "Track D added (part-time postdoc-style research, found by writing to labs directly) and an outreach_search section"
    because: he has done this before; it is a way to get research work alongside teaching in biology, computational biology or AI research at a business school
  - date: 2026-10-19
    change: "outreach search defined: the lab is the unit; best fit is computational biology and data-heavy labs; Harvard Business School, MIT Sloan, the Broad and Whitehead Institutes and think tanks added; tiny labs and faculty without a lab site are not targets"
    because: he is applying to a lab to be funded and used, so a lab that cannot pay or has no data to compute on is not a target
  - date: 2026-10-19
    change: the big Boston hospitals added as places to read (Massachusetts General Hospital, Boston Children's Hospital, and others to be named)
    because: that is where much of the data-heavy biology in Boston is done, and where a computational biologist would be needed
  - date: 2026-10-19
    change: "distance rule for the outreach search: mostly remote, on-site about once a week, within about one to three miles of Northeastern (Longwood, Mass General at the far end, Harvard and Cambridge near the Broad, Allston); not Tufts"
    because: the work is meant to sit alongside teaching, so it has to be reachable by a few T stops
  - date: 2026-10-19
    change: Moderna added as a company to look at, found on his map of Kendall Square
    because: he named it a great target for AI help; the public record shows heavy AI use and an in-house team, so the need is the open question
  - date: 2026-10-19
    change: "outreach search filtered to biology, finance, economics, the MIT Media Lab and people doing interesting things with education; \"think tank\" defined as any group of very smart people working on hard problems, so research institutes count"
    because: a research snapshot he pasted split policy think tanks from science institutes and said the Broad and Whitehead were not think tanks; he called the distinction wrong for his purpose, which is the topic, not the kind of place
  - date: 2026-10-19
    change: "review gate for the outreach search: great-fit labs and research groups are posted to Discord for him to look at; nothing is approached before he has looked; pretty-good fits only when he says so. Northeastern consulting or joint faculty noted as a hypothesis to check against his agreements"
    because: he wants to read each group's page himself before any contact, and has not yet read the agreements that might attach conditions to outside work
  - date: 2026-10-19
    change: "a special first search of Northeastern's business school and Institute for Experiential AI for paid research with a group; two great fits posted to Discord"
    because: he said those are the easiest people to contact and his MBA is from the school
  - date: 2026-10-19
    change: Replit removed from the watch list
    because: "he said it is not really educational AI, just AI: not educational software in the sense that Claude for University, NotebookLM and Claude Science are, more a low-level app, and the role he read there (Learning Experiences Creator) an entry-level, low-level job"

flexibility_check: >-
  Nothing here claims flexibility. Every null is a question, not an assumption.
